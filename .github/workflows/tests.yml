name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --constraint requirements/constraints.txt -e ".[dev]"
      - run: python -m pytest

  distributions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install --constraint requirements/constraints.txt -e ".[dev]"
      - run: .\.venv\Scripts\python.exe tools/verify_release.py --output dist --report dist/release-verification.json
      - uses: actions/upload-artifact@v7
        with:
          name: tora-meshforge-python-distributions
          path: dist/
